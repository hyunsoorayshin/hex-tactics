<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Rayhaven</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    #map-container {
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
    }
    #map {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    #hex-overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .hex {
      pointer-events: all;
      cursor: pointer;
      fill: transparent;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1;
      transition: fill 0.15s;
    }
    .hex:hover {
      fill: rgba(255, 215, 0, 0.25);
      stroke: rgba(255, 215, 0, 0.6);
      stroke-width: 2;
    }
    .hex.selected {
      fill: rgba(0, 255, 0, 0.3);
      stroke: rgba(0, 255, 0, 0.8);
    }
    .hex-edge {
      stroke: transparent;
      stroke-width: 10;
      fill: none;
      pointer-events: stroke;
      cursor: pointer;
    }
    .hex-edge:hover {
      stroke: rgba(255, 100, 100, 0.5);
    }
    .hex-edge.selected {
      stroke: rgba(255, 50, 50, 0.8);
    }

    /* Status Bar */
    #status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }
    #status-bar .team-indicator {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }
    #status-bar .divider {
      color: #555;
    }
    #status-bar .mode {
      padding: 2px 8px;
      border-radius: 3px;
      background: #333;
    }
    #status-bar .mode.active {
      background: #4a4;
      color: #fff;
    }
    #status-bar .hint {
      color: #888;
      margin-left: auto;
    }

    /* Notification */
    #notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      background: rgba(40, 167, 69, 0.9);
      color: #fff;
      border-radius: 6px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      z-index: 1001;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #notification.error {
      background: rgba(220, 53, 69, 0.9);
    }

    /* Team Panel */
    #team-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 30, 0.95);
      border-radius: 12px;
      padding: 24px;
      min-width: 450px;
      max-width: 550px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 2000;
      display: none;
      font-family: system-ui, -apple-system, sans-serif;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #team-panel.visible {
      display: block;
    }
    #team-panel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1999;
      display: none;
    }
    #team-panel-overlay.visible {
      display: block;
    }
    #team-panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    #team-panel-color {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
    #team-panel-name {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 4px 0;
      outline: none;
      flex: 1;
    }
    #team-panel-name:hover {
      border-bottom-color: rgba(255, 255, 255, 0.3);
    }
    #team-panel-name:focus {
      border-bottom-color: #4a9eff;
    }
    #team-panel-close {
      background: none;
      border: none;
      color: #888;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    #team-panel-close:hover {
      color: #fff;
    }
    .team-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .team-stat {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .team-stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
    }
    .team-stat-label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .team-section {
      margin-bottom: 20px;
    }
    .team-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .team-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .team-section-add {
      background: rgba(74, 158, 255, 0.2);
      border: none;
      color: #4a9eff;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .team-section-add:hover {
      background: rgba(74, 158, 255, 0.3);
    }
    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 6px;
    }
    .player-name {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
    }
    .player-name:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .player-name:focus {
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }
    .player-gold {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .player-gold-icon {
      color: #ffd700;
    }
    .player-gold-input {
      width: 70px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #ffd700;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      text-align: right;
    }
    .player-gold-input:focus {
      outline: none;
      border-color: #ffd700;
    }
    .player-remove {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
    }
    .player-remove:hover {
      color: #ff6666;
    }
    .empty-message {
      color: #666;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="map-container">
      <img id="map" src="map.png" alt="Map">
      <svg id="hex-overlay"></svg>
    </div>
  </div>

  <!-- Team Panel Overlay -->
  <div id="team-panel-overlay"></div>

  <!-- Team Panel -->
  <div id="team-panel">
    <div id="team-panel-header">
      <div id="team-panel-color"></div>
      <input type="text" id="team-panel-name" value="Team Name">
      <button id="team-panel-close">&times;</button>
    </div>

    <div class="team-stats">
      <div class="team-stat">
        <div class="team-stat-value" id="stat-gold">0</div>
        <div class="team-stat-label">Total Gold</div>
      </div>
      <div class="team-stat">
        <div class="team-stat-value" id="stat-land">0</div>
        <div class="team-stat-label">Land</div>
      </div>
      <div class="team-stat">
        <div class="team-stat-value" id="stat-assets">0</div>
        <div class="team-stat-label">Assets</div>
      </div>
    </div>

    <div class="team-section">
      <div class="team-section-header">
        <span class="team-section-title">Players / Students</span>
        <button class="team-section-add" id="add-player-btn">+ Add Player</button>
      </div>
      <div class="player-list" id="player-list">
        <!-- Players will be added here -->
      </div>
    </div>
  </div>

  <!-- Module Scripts (order matters) -->
  <script src="js/gameState.js"></script>
  <script src="js/hexGrid.js"></script>
  <script src="js/panZoom.js"></script>
  <script src="js/teamPanel.js"></script>
  <script src="js/saveLoad.js"></script>
  <script src="js/ui.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
