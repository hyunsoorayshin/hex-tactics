<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Rayhaven</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="viewport">
    <div id="map-container">
      <img id="map" src="map.png" alt="Map">
      <svg id="hex-overlay"></svg>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar"></div>

  <!-- Notification -->
  <div id="notification"></div>

  <!-- Team Panel (created by teamPanel.js) -->
  <div id="team-panel-overlay"></div>
  <div id="team-panel"></div>

  <!-- Module Scripts (order matters) -->
  <script src="js/gameState.js"></script>
  <script src="js/landMode.js"></script>
  <script src="js/playerMode.js"></script>
  <script src="js/castleMode.js"></script>
  <script src="js/bridgeMode.js"></script>
  <script src="js/armyMode.js"></script>
  <script src="js/townMode.js"></script>
  <script src="js/wallMode.js"></script>
  <script src="js/shipMode.js"></script>
  <script src="js/hexGrid.js"></script>
  <script src="js/panZoom.js"></script>
  <script src="js/teamPanel.js"></script>
  <script src="js/saveLoad.js"></script>
  <script src="js/ui.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
